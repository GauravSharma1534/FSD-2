# Frontend
- name: Setup Node
  uses: actions/setup-node@v3
  with:
    node-version: '18'

- name: Install dependencies
  run: |
    cd Experiment-16/frontend
    npm install

- name: Install Jest manually
  run: |
    cd Experiment-16/frontend
    npm install jest

- name: Run frontend tests
  run: |
    cd Experiment-16/frontend
    npx jest