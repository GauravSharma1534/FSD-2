- name: Setup Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.11'

- name: Install backend deps
  working-directory: Experiment-16/backend
  run: |
    python -m pip install --upgrade pip
    pip install flask pytest

- name: Run backend tests
  working-directory: Experiment-16/backend
  run: |
    python -m pytest