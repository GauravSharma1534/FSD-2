name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # ---------------- BACKEND ----------------
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install backend deps
      working-directory: Experiment-16/backend
      run: |
        pip install -r requirements.txt

    - name: Run backend tests
      working-directory: Experiment-16/backend
      run: |
        python -m pytest

    # ---------------- FRONTEND ----------------
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend deps
      working-directory: Experiment-16/frontend
      run: |
        npm install

    - name: Run frontend tests
      working-directory: Experiment-16/frontend
      run: |
        npx jest