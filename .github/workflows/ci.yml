name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ---------------- BACKEND ----------------
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      working-directory: Experiment-16/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      working-directory: Experiment-16/backend
      run: |
        python -m pytest

    # ---------------- FRONTEND ----------------
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      working-directory: Experiment-16/frontend
      run: |
        npm install

    # 🔥 IMPORTANT FIX (JEST INSTALL)
    - name: Ensure Jest installed
      working-directory: Experiment-16/frontend
      run: |
        npm install --save-dev jest

    - name: Run frontend tests
      working-directory: Experiment-16/frontend
      run: |
        npm test